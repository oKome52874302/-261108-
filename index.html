<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ファイブボンバー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 設定画面 -->
  <section id="screen-setup" class="screen active">
    <h1 class="logo">FIVE BOMBER</h1>
    <div class="setup-grid">
      <label>チーム名（1行に1チーム）
        <textarea id="input-teams" rows="4">Aチーム
Bチーム</textarea>
      </label>
      <label>制限時間（秒）
        <input id="input-time" type="number" min="5" max="180" value="30">
      </label>
      <label>目標正解数
        <input id="input-target" type="number" min="1" max="12" value="5">
      </label>
      <label>クリアボーナス（点）
        <input id="input-bonus" type="number" min="0" max="100" value="3">
      </label>
      <label class="check"><input id="input-shuffle" type="checkbox" checked> お題をシャッフル</label>
    </div>
    <button id="btn-start" class="big-btn">ゲーム開始</button>
    <p class="hint">お題は <code>data/questions.js</code> を編集して追加できます（現在 <span id="q-count">0</span> 問）</p>
  </section>

  <!-- ゲーム画面 -->
  <section id="screen-game" class="screen">
    <header class="game-header">
      <div id="team-name" class="team-name"></div>
      <div id="round-info" class="round-info"></div>
    </header>

    <div id="timer" class="timer">30</div>

    <div id="theme" class="theme"></div>

    <div id="slots" class="slots"></div>

    <div id="banner" class="banner"></div>

    <footer class="operator">
      <input id="input-answer" type="text" placeholder="回答を入力（任意）→ Enter で正解" autocomplete="off">
      <div class="keys">
        <span><kbd>Space</kbd> 開始/一時停止</span>
        <span><kbd>Enter</kbd> 正解</span>
        <span><kbd>X</kbd> 不正解</span>
        <span><kbd>Backspace</kbd> 取り消し</span>
        <span><kbd>N</kbd> 次へ</span>
        <span><kbd>S</kbd> スコア</span>
      </div>
    </footer>
  </section>

  <!-- スコア画面 -->
  <section id="screen-score" class="screen">
    <h2>スコア</h2>
    <ol id="score-list" class="score-list"></ol>
    <p class="hint"><kbd>S</kbd> / <kbd>Esc</kbd> でゲームに戻る</p>
  </section>

  <script src="data/questions.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
